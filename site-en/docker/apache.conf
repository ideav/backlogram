ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html
    # Lets .htaccess skip the https/www redirect in local and test setups.
    PassEnv INTEGRAM_NO_REDIRECT

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Uploads and per-workspace templates never execute and never get their own .htaccess.
    <Directory /var/www/html/download>
        AllowOverride None
        Options -ExecCGI -Indexes
        <FilesMatch "\.(php\d?|phtml|phar|pht|cgi|pl|sh|asp|jsp|htaccess)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /var/www/html/templates/custom>
        AllowOverride None
        Options -ExecCGI -Indexes
        <FilesMatch "\.(php\d?|phtml|phar|pht|cgi|pl|sh|asp|jsp|htaccess)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /var/www/html/logs>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
