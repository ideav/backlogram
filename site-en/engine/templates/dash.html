<link rel="stylesheet" href="/css/dash.css?{_global_.version}.1">

<div id="dash-status" class="dash-status m-3 text-muted" role="status"></div>
<div id="dash-model" class="f-model m-2">
    <ul class="nav nav-tabs sheet-tabs"></ul>
    <div class="sheets"></div>
</div>

<!-- Formula editor modal -->
<div id="dash-formula-modal" role="dialog" aria-modal="true">
    <div class="dash-modal-box">
        <h6>Edit formula</h6>
        <textarea id="dash-formula-textarea" rows="4"></textarea>
        <div class="dash-modal-btns">
            <button class="dash-apply-btn dash-btn-primary" id="dash-formula-save">Save</button>
            <button class="dash-apply-btn dash-btn-secondary" id="dash-formula-cancel">Cancel</button>
        </div>
    </div>
</div>

<!-- Multiple values modal -->
<div id="dash-multival-modal" role="dialog" aria-modal="true">
    <div class="dash-modal-box">
        <h6>Multiple values found</h6>
        <p id="dash-multival-subtitle"></p>
        <ul id="dash-multival-list"></ul>
        <div class="dash-modal-btns">
            <a id="dash-multival-link" href="#" target="_blank" style="font-size:0.85rem">Show in table</a>
            <button class="dash-apply-btn" id="dash-multival-close">Close</button>
        </div>
    </div>
</div>

<!-- Readonly tooltip -->
<div class="dash-readonly-tip" id="dash-readonly-tip">Read only</div>

<!-- Sum of selected cells -->
<div id="dash-selection-sum" aria-live="polite"></div>

<!-- Panel filter modal -->
<div id="dash-panel-filter-modal" role="dialog" aria-modal="true">
    <div class="dash-modal-box dash-panel-filter-modal-box">
        <h6>Panel filter</h6>
        <div id="dash-panel-filter-fields" class="dash-panel-filter-fields"></div>
        <div class="dash-modal-btns">
            <button class="dash-apply-btn dash-btn-primary" id="dash-panel-filter-apply">Apply</button>
            <button class="dash-apply-btn dash-btn-secondary" id="dash-panel-filter-reset">Reset</button>
            <button class="dash-apply-btn dash-btn-secondary" id="dash-panel-filter-cancel">Cancel</button>
        </div>
    </div>
</div>

<!-- Panel visualization settings modal -->
<div id="dash-viz-modal" role="dialog" aria-modal="true">
    <div class="dash-modal-box dash-viz-modal-box">
        <h6>Panel display options</h6>
        <ul class="dash-viz-tabs" role="tablist">
            <li class="dash-viz-tab active" data-viz-tab="panels" role="tab" aria-selected="true" tabindex="0">Charts</li>
            <li class="dash-viz-tab" data-viz-tab="general" role="tab" aria-selected="false" tabindex="0">General settings</li>
        </ul>
        <div class="dash-viz-tab-pane active" data-viz-tab-pane="panels">
            <div id="dash-viz-accordion" class="dash-viz-accordion"></div>
        </div>
        <div class="dash-viz-tab-pane" data-viz-tab-pane="general">
            <div id="dash-panel-general-settings" class="dash-panel-general-settings"></div>
        </div>
        <div class="dash-modal-btns">
            <button class="dash-apply-btn dash-btn-primary" id="dash-viz-save">Save</button>
            <button class="dash-apply-btn dash-btn-secondary" id="dash-viz-cancel">Cancel</button>
        </div>
    </div>
</div>


<div id="dash-opt-modal" role="dialog" aria-modal="true">
    <div class="dash-modal-box dash-opt-modal-box">
        <h6>Model optimization</h6>
        <div id="dash-opt-body" class="dash-opt-body"></div>
        <div class="dash-modal-btns">
            <button class="dash-apply-btn dash-btn-secondary" id="dash-opt-close">Close</button>
        </div>
    </div>
</div>
<button type="button" id="dash-opt-open" class="dash-opt-fab" title="Model optimization">🎯 Optimize</button>

<script src="/js/dash.js?{_global_.version}.1"></script>
<script src="/js/dash-optimize.js?{_global_.version}.1"></script>
