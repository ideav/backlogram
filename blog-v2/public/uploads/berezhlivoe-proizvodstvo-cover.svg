<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Бережливое производство: Lean для Lean</title>
<desc id="d">Поток создания ценности из четырёх операций с пультом оператора и столбики затрат, которые падают в разы.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#060d20"/><stop offset="0.55" stop-color="#0a1c47"/><stop offset="1" stop-color="#123a8f"/>
 </linearGradient>
 <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#60a5fa" stop-opacity="0.40"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
 </radialGradient>
 <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="1.3" fill="#8ab4f8" fill-opacity="0.12"/>
 </pattern>
 <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7dd3fc"/></marker>
 <style>
  .card{fill:#0d2557;stroke:#38bdf8;stroke-opacity:0.45;stroke-width:1.6}
  .flow{fill:none;stroke:#7dd3fc;stroke-width:2.2;marker-end:url(#arrA)}
  .ttl{fill:#ffffff;font-weight:700;font-size:54px;font-family:Arial,sans-serif}
  .ttl2{fill:#7dd3fc;font-weight:700;font-size:54px;font-family:Arial,sans-serif}
  .sub{fill:#cfe0ff;fill-opacity:0.85;font-weight:400;font-size:18px;font-family:Arial,sans-serif}
  .lbl{fill:#e0f2fe;font-weight:700;font-size:13.5px;font-family:Arial,sans-serif}
  .lbl2{fill:#cfe0ff;fill-opacity:0.7;font-weight:400;font-size:11.5px;font-family:Arial,sans-serif}
  .amb{fill:#fbbf24}
 </style>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect width="1200" height="630" fill="url(#dots)"/>
<circle cx="880" cy="320" r="310" fill="url(#glow)"/>
<circle cx="230" cy="130" r="230" fill="url(#glow)" opacity="0.5"/>
<text x="64" y="150" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3" fill="#7dd3fc" fill-opacity="0.9">LEAN • ПОТОК • ПУЛЬТЫ</text>
<text class="ttl" x="64" y="220">Бережливое</text>
<text class="ttl" x="64" y="284">производство:</text>
<text class="ttl2" x="64" y="348">Lean для Lean</text>
<text class="sub" x="64" y="406">Инструменты для цеха, собранные</text>
<text class="sub" x="64" y="432">так же бережливо, как цех работает.</text>
<g>
 <rect x="640" y="150" width="105" height="64" rx="10" class="card"/>
 <rect x="767" y="150" width="105" height="64" rx="10" class="card"/>
 <rect x="894" y="150" width="105" height="64" rx="10" class="card"/>
 <rect x="1021" y="150" width="105" height="64" rx="10" class="card"/>
 <path d="M745,182 H760" class="flow"/><path d="M872,182 H887" class="flow"/><path d="M999,182 H1014" class="flow"/>
 <text class="lbl" x="692" y="180" text-anchor="middle">заказ</text>
 <text class="lbl" x="819" y="180" text-anchor="middle">план</text>
 <text class="lbl" x="946" y="180" text-anchor="middle">наладка</text>
 <text class="lbl" x="1073" y="180" text-anchor="middle">выпуск</text>
 <text class="lbl2" x="692" y="200" text-anchor="middle">тянущий</text>
 <text class="lbl2" x="819" y="200" text-anchor="middle">по станкам</text>
 <text class="lbl2" x="946" y="200" text-anchor="middle">по нормам</text>
 <text class="lbl2" x="1073" y="200" text-anchor="middle">с пульта</text>
 <circle cx="946" cy="236" r="7" class="amb"/>
 <text class="lbl2" x="960" y="240">простой виден сразу</text>
</g>
<g>
 <rect x="640" y="282" width="486" height="226" rx="12" class="card"/>
 <text class="lbl" x="664" y="314">Затраты</text>
 <text class="lbl2" x="664" y="332">разработка и производство: до и после</text>
 <rect x="700" y="356" width="70" height="128" rx="4" fill="#7dd3fc" fill-opacity="0.30"/>
 <rect x="790" y="470" width="70" height="14" rx="4" fill="#7dd3fc"/>
 <rect x="930" y="356" width="70" height="128" rx="4" fill="#fbbf24" fill-opacity="0.30"/>
 <rect x="1020" y="440" width="70" height="44" rx="4" class="amb"/>
 <text class="lbl" x="825" y="458" text-anchor="middle" style="fill:#7dd3fc">÷10</text>
 <text class="lbl" x="1055" y="428" text-anchor="middle" style="fill:#fbbf24">в разы</text>
 <text class="lbl2" x="780" y="500" text-anchor="middle">разработка</text>
 <text class="lbl2" x="1010" y="500" text-anchor="middle">производство</text>
</g>
<text x="64" y="560" font-family="Arial" font-size="20" font-weight="700" letter-spacing="1" fill="#ffffff">ИНТЕГРАМ</text>
<text x="64" y="584" font-family="Arial" font-size="13" fill="#cfe0ff" fill-opacity="0.7">ideav.ru/blog</text>
</svg>
