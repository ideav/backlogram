<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Переезд из Airtable: экспорт, связи, вложения</title>
<desc id="d">Выгруженные из Airtable CSV-файлы таблиц и вложения стрелками сходятся в одну базу данных со связями, справочниками и файлами.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#060d20"/><stop offset="0.55" stop-color="#0a1c47"/><stop offset="1" stop-color="#123a8f"/>
 </linearGradient>
 <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#60a5fa" stop-opacity="0.40"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="strong" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#3b6bc4" stop-opacity="0.35"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0.95"/>
 </linearGradient>
 <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="1.3" fill="#8ab4f8" fill-opacity="0.12"/>
 </pattern>
 <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7dd3fc"/></marker>
 <style>
  .card{fill:#0d2557;stroke:#38bdf8;stroke-opacity:0.45;stroke-width:1.6}
  .box{fill:none;stroke:#7dd3fc;stroke-opacity:0.55;stroke-width:1.6}
  .chk{fill:none;stroke:#7dd3fc;stroke-width:2.2;stroke-linecap:round}
  .bar{fill:#7dd3fc;fill-opacity:0.30}
  .ttl{fill:#ffffff;font:700 54px Arial,sans-serif}
  .ttl2{fill:#7dd3fc;font:700 54px Arial,sans-serif}
  .brow{fill:#ffffff;font:700 20px Arial,sans-serif;letter-spacing:1px}
  .tag{fill:#bfd7ff;font:400 8px Arial,sans-serif;letter-spacing:1.2px}
  .sub{fill:#cfe0ff;fill-opacity:0.85;font:400 18px Arial,sans-serif}
  .lbl{fill:#e0f2fe;font:700 13.5px Arial,sans-serif}
  .lbl2{fill:#cfe0ff;fill-opacity:0.7;font:400 11.5px Arial,sans-serif}
 </style>
</defs>

<rect width="1200" height="630" fill="url(#bg)"/>
<rect width="1200" height="630" fill="url(#dots)"/>
<circle cx="860" cy="320" r="310" fill="url(#glow)"/>
<circle cx="230" cy="130" r="230" fill="url(#glow)" opacity="0.5"/>


<text x="64" y="150" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3" fill="#7dd3fc" fill-opacity="0.9">ПОШАГОВО • AIRTABLE → СВОЯ БАЗА</text>
<text class="ttl" x="64" y="220">Переезд</text>
<text class="ttl" x="64" y="284">из Airtable:</text>
<text class="ttl2" x="64" y="348">связи и файлы</text>
<text class="sub" x="64" y="406">CSV по таблицам, справочники первыми,</text>
<text class="sub" x="64" y="432">вложения — в тот же день.</text>
<g>
 <rect class="card" x="640" y="150" width="150" height="92" rx="12"/><text class="lbl" x="715" y="180" text-anchor="middle">Клиенты.csv</text>
 <rect class="bar" x="660" y="196" width="110" height="8" rx="4"/><rect class="bar" x="660" y="214" width="84" height="8" rx="4"/>
 <rect class="card" x="640" y="270" width="150" height="92" rx="12"/><text class="lbl" x="715" y="300" text-anchor="middle">Заказы.csv</text>
 <rect class="bar" x="660" y="316" width="104" height="8" rx="4"/><rect class="bar" x="660" y="334" width="92" height="8" rx="4"/>
 <rect class="card" x="640" y="390" width="150" height="92" rx="12"/><text class="lbl" x="715" y="420" text-anchor="middle">Вложения</text>
 <rect class="box" x="662" y="436" width="26" height="30" rx="3"/><rect class="box" x="700" y="436" width="26" height="30" rx="3"/><rect class="box" x="738" y="436" width="26" height="30" rx="3"/>
</g>
<path d="M800,196 C860,200 880,260 930,290" fill="none" stroke="url(#strong)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrA)"/>
<path d="M800,316 C850,316 880,316 924,316" fill="none" stroke="url(#strong)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrA)"/>
<path d="M800,436 C860,432 880,370 930,342" fill="none" stroke="url(#strong)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrA)"/>
<g>
 <path d="M944,280 L944,370 A60,20 0 0 0 1064,370 L1064,280" fill="#0d2557" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.8"/>
 <ellipse cx="1004" cy="280" rx="60" ry="20" fill="#0d2557" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.8"/>
 <path d="M944,310 A60,20 0 0 0 1064,310" fill="none" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1.2"/>
 <path d="M944,340 A60,20 0 0 0 1064,340" fill="none" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1.2"/>
</g>
<text class="lbl" x="1004" y="424" text-anchor="middle">база со связями</text>
<text class="lbl2" x="1004" y="444" text-anchor="middle">справочники, файлы, роли</text>

<!-- бейдж -->
<g transform="translate(946,538) scale(0.47)">
 <rect width="120" height="120" rx="24" fill="#1447E6"/>
 <path d="M43.8 85.2 12 74.7V45.3l31.8-10.5 11.7 12.4-7.1 7.4-8.1-8.6-17.7 5.8v16.4L40.3 74 77.6 34.8 108 45.3v29.4L76.2 85.2 64.5 72.8l7.1-7.4 8.1 8.6 17.7-5.8V51.8L79.7 46 43.8 85.2Z" fill="#FFFFFF"/>
 <path d="M42.4 63.5 33 53.8l7.2-7.4 9.4 9.8-7.2 7.3ZM79.8 73.6l-9.4-9.8 7.2-7.3 9.4 9.7-7.2 7.4Z" fill="#BFD7FF"/>
</g>
<text class="brow" x="1008" y="570">ИНТЕГРАМ</text>
<text class="tag" x="1009" y="588">СИСТЕМА ИНТЕГРАЦИИ ДАННЫХ</text>

</svg>
