<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">8 видов потерь в бережливом производстве</title><desc id="d">Восемь карточек: перепроизводство, ожидание, лишняя транспортировка, лишняя обработка, лишние запасы, лишние движения, дефекты, неиспользованный потенциал людей.</desc>
<rect width="1200" height="675" fill="#F5F7FB"/>
<text x="50" y="78" font-size="38" font-weight="700" fill="#0F1B3D">8 видов потерь (муда) в бережливом производстве</text><text x="50" y="112" font-size="19" fill="#5B6785">Всё, за что заказчик не платит, — потери. Их ищут в потоке и убирают.</text><rect x="50" y="150" width="261" height="205" rx="14" fill="#fff" stroke="#DCE3F2" stroke-width="1.5"/><circle cx="86" cy="190" r="17" fill="#1447E6"/><text x="86" y="196" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="245" y="190" width="16" height="16" stroke="#1447E6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="265" y="190" width="16" height="16" stroke="#1447E6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="255" y="174" width="16" height="16" stroke="#1447E6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="248.0" font-size="20" font-weight="700" fill="#0F1B3D" text-anchor="start">Перепроизводство</text><text x="72" y="281.0" font-size="15" font-weight="400" fill="#5B6785" text-anchor="start">Делаем больше или раньше,</text>
<text x="72" y="302.0" font-size="15" font-weight="400" fill="#5B6785" text-anchor="start">чем нужно заказчику</text><rect x="331" y="150" width="261" height="205" rx="14" fill="#fff" stroke="#DCE3F2" stroke-width="1.5"/><circle cx="367" cy="190" r="17" fill="#1447E6"/><text x="367" y="196" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="544" cy="192" r="18" stroke="#1447E6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M544 183 V192 L552 197" stroke="#1447E6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="353" y="248.0" font-size="20" font-weight="700" fill="#0F1B3D" text-anchor="start">Ожидание</text><text x="353" y="281.0" font-size="15" font-weight="400" fill="#5B6785" text-anchor="start">Заказ ждёт станок,</text>
<text x="353" y="302.0" font-size="15" font-weight="400" fill="#5B6785" text-anchor="start">оператор ждёт материал</text><rect x="612" y="150" width="261" height="205" rx="14" fill="#fff" stroke="#DCE3F2" stroke-width="1.5"/><circle cx="648" cy="190" r="17" fill="#1447E6"/><text x="648" y="196" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><path d="M805 192 H841 M831 182 L842 192 L831 202" stroke="#1447E6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="805" y="176" width="14" height="10" stroke="#1447E6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="634" y="248.0" font-size="20" font-weight="700" fill="#0F1B3D" text-anchor="start">Лишняя</text>
<text x="634" y="273.0" font-size="20" font-weight="700" fill="#0F1B3D" text-anchor="start">транспортировка</text><text x="634" y="306.0" font-size="15" font-weight="400" fill="#5B6785" text-anchor="start">Лишние перевозки между</text>
<text x="634" y="327.0" font-size="15" font-weight="400" fill="#5B6785" text-anchor="start">участками</text><rect x="893" y="150" width="261" height="205" rx="14" fill="#fff" stroke="#DCE3F2" stroke-width="1.5"/><circle cx="929" cy="190" r="17" fill="#1447E6"/><text x="929" y="196" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="1106" cy="192" r="9" stroke="#1447E6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1106 172 V179 M1106 205 V212 M1086 192 H1093 M1119 192 H1126" stroke="#1447E6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="915" y="248.0" font-size="20" font-weight="700" fill="#0F1B3D" text-anchor="start">Лишняя обработка</text><text x="915" y="281.0" font-size="15" font-weight="400" fill="#5B6785" text-anchor="start">Операции, за которые</text>
<text x="915" y="302.0" font-size="15" font-weight="400" fill="#5B6785" text-anchor="start">заказчик не платит</text><rect x="50" y="375" width="261" height="205" rx="14" fill="#fff" stroke="#DCE3F2" stroke-width="1.5"/><circle cx="86" cy="415" r="17" fill="#1447E6"/><text x="86" y="421" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text><path d="M243 433 H283 M249 433 V423 H277 V433 M255 423 V413 H271 V423 M261 413 V403 H265 V413" stroke="#1447E6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="473.0" font-size="20" font-weight="700" fill="#0F1B3D" text-anchor="start">Лишние запасы</text><text x="72" y="506.0" font-size="15" font-weight="400" fill="#5B6785" text-anchor="start">Сырьё и заготовки сверх</text>
<text x="72" y="527.0" font-size="15" font-weight="400" fill="#5B6785" text-anchor="start">необходимого</text><rect x="331" y="375" width="261" height="205" rx="14" fill="#fff" stroke="#DCE3F2" stroke-width="1.5"/><circle cx="367" cy="415" r="17" fill="#1447E6"/><text x="367" y="421" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">6</text><path d="M524 431 L536 407 L548 427 L560 403" stroke="#1447E6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M552 403 H561 V412" stroke="#1447E6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="353" y="473.0" font-size="20" font-weight="700" fill="#0F1B3D" text-anchor="start">Лишние движения</text><text x="353" y="506.0" font-size="15" font-weight="400" fill="#5B6785" text-anchor="start">Лишние шаги, поиск</text>
<text x="353" y="527.0" font-size="15" font-weight="400" fill="#5B6785" text-anchor="start">инструмента и документов</text><rect x="612" y="375" width="261" height="205" rx="14" fill="#fff" stroke="#DCE3F2" stroke-width="1.5"/><circle cx="648" cy="415" r="17" fill="#1447E6"/><text x="648" y="421" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">7</text><rect x="808" y="400" width="34" height="34" rx="4" stroke="#1447E6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M817 409 L833 425 M833 409 L817 425" stroke="#E8590C" stroke-width="3" stroke-linecap="round" fill="none"/><text x="634" y="473.0" font-size="20" font-weight="700" fill="#0F1B3D" text-anchor="start">Дефекты</text><text x="634" y="506.0" font-size="15" font-weight="400" fill="#5B6785" text-anchor="start">Брак и переделки</text><rect x="893" y="375" width="261" height="205" rx="14" fill="#fff" stroke="#DCE3F2" stroke-width="1.5"/><circle cx="929" cy="415" r="17" fill="#1447E6"/><text x="929" y="421" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">8</text><circle cx="1106" cy="409" r="8" stroke="#1447E6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1090 435 C1090 421 1122 421 1122 435" stroke="#1447E6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="915" y="473.0" font-size="20" font-weight="700" fill="#0F1B3D" text-anchor="start">Неиспользованный</text>
<text x="915" y="498.0" font-size="20" font-weight="700" fill="#0F1B3D" text-anchor="start">потенциал</text><text x="915" y="531.0" font-size="15" font-weight="400" fill="#5B6785" text-anchor="start">Идеи и навыки людей</text>
<text x="915" y="552.0" font-size="15" font-weight="400" fill="#5B6785" text-anchor="start">остаются без дела</text><rect x="957" y="404" width="118" height="22" rx="11" fill="none" stroke="#E8590C" stroke-width="1.5"/><text x="1016" y="419.5" font-size="12" font-weight="600" fill="#E8590C" text-anchor="middle">добавлена позже</text><text x="1150" y="648" font-size="14" fill="#5B6785" text-anchor="end">Первые семь потерь описал Тайити Оно (Toyota)</text>
<text x="50" y="648" font-size="14" fill="#5B6785">Блог Интеграм · ideav.ru</text>
</svg>