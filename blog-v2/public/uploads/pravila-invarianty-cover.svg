<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Одна дверь записи: инварианты проверяются на границе</title>
<desc id="d">Разрозненные входы сходятся в единственный шлюз записи с реестром инвариантов; нарушение отклоняется на границе; поток возвратов затухает.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#060d20"/><stop offset="0.55" stop-color="#0a1c47"/><stop offset="1" stop-color="#123a8f"/>
 </linearGradient>
 <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#60a5fa" stop-opacity="0.42"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
 </radialGradient>
 <radialGradient id="gateglow" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#a5f3fc" stop-opacity="0.55"/><stop offset="0.45" stop-color="#38bdf8" stop-opacity="0.22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#1e3a75"/><stop offset="0.5" stop-color="#2f5aa8"/><stop offset="1" stop-color="#16294f"/>
 </linearGradient>
 <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#3b6bc4" stop-opacity="0.22"/><stop offset="0.6" stop-color="#5b93e0" stop-opacity="0.6"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0.95"/>
 </linearGradient>
 <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="664" y1="0" x2="1170" y2="0">
  <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a5f3fc"/>
 </linearGradient>
 <linearGradient id="deny" gradientUnits="userSpaceOnUse" x1="612" y1="0" x2="396" y2="0">
  <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0.35"/>
 </linearGradient>
 <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
 <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#fbbf24"/></marker>
 <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="1.3" fill="#8ab4f8" fill-opacity="0.12"/>
 </pattern>
 <style>
  .in{fill:none;stroke:url(#flow);stroke-width:2.4;stroke-linecap:round}
  .src{fill:#cfe0ff}
  .srcr{fill:none;stroke:#7dd3fc;stroke-opacity:0.30;stroke-width:1.4}
  .srcg{fill:#60a5fa;filter:url(#soft);opacity:0.55}
  .bar{fill:#7dd3fc}
  .axis{fill:none;stroke:#9cc4ff;stroke-opacity:0.22;stroke-width:1.4;stroke-dasharray:6 9}
  .ghost{fill:none;stroke:#60a5fa;stroke-opacity:0.13;stroke-width:2}
  .wv{fill:none;stroke:url(#wave);stroke-width:3.4;stroke-linecap:round}
  .node{fill:#e0f2fe}
 </style>
</defs>

<rect width="1200" height="630" fill="url(#bg)"/>
<rect width="1200" height="630" fill="url(#dots)"/>
<circle cx="230" cy="330" r="330" fill="url(#glow)" opacity="0.75"/>
<circle cx="980" cy="150" r="300" fill="url(#glow)" opacity="0.45"/>

<!-- разрозненные входы: кнопка, автоматика, импорт, массовая операция, drag-and-drop -->
<g class="in">
 <path d="M96,104 C286,104 468,256 606,315"/>
 <path d="M168,196 C358,196 468,282 606,315"/>
 <path d="M84,300 C274,300 468,311 606,315"/>
 <path d="M176,402 C366,402 468,339 606,315"/>
 <path d="M100,500 C290,500 468,367 606,315"/>
 <path d="M238,560 C392,566 520,548 612,470" stroke-opacity="0.75"/>
</g>

<g>
 <circle class="srcg" cx="96" cy="104" r="11"/><circle class="src" cx="96" cy="104" r="6.5"/><circle class="srcr" cx="96" cy="104" r="13"/>
 <circle class="srcg" cx="168" cy="196" r="11"/><circle class="src" cx="168" cy="196" r="6.5"/><circle class="srcr" cx="168" cy="196" r="13"/>
 <circle class="srcg" cx="84" cy="300" r="11"/><circle class="src" cx="84" cy="300" r="6.5"/><circle class="srcr" cx="84" cy="300" r="13"/>
 <circle class="srcg" cx="176" cy="402" r="11"/><circle class="src" cx="176" cy="402" r="6.5"/><circle class="srcr" cx="176" cy="402" r="13"/>
 <circle class="srcg" cx="100" cy="500" r="11"/><circle class="src" cx="100" cy="500" r="6.5"/><circle class="srcr" cx="100" cy="500" r="13"/>
 <circle class="srcg" cx="238" cy="560" r="10"/><circle class="src" cx="238" cy="560" r="6"/><circle class="srcr" cx="238" cy="560" r="12"/>
</g>

<!-- граница записи: стена во всю высоту с единственным проёмом -->
<circle cx="639" cy="315" r="150" fill="url(#gateglow)"/>
<rect x="620" y="-20" width="38" height="278" rx="6" fill="url(#wall)"/>
<rect x="620" y="372" width="38" height="278" rx="6" fill="url(#wall)"/>
<rect x="620" y="258" width="38" height="114" fill="#050b1c" opacity="0.72"/>
<rect x="622" y="246" width="34" height="12" rx="6" fill="#7dd3fc" opacity="0.9" filter="url(#soft2)"/>
<rect x="622" y="372" width="34" height="12" rx="6" fill="#7dd3fc" opacity="0.9" filter="url(#soft2)"/>
<line x1="621" y1="-20" x2="621" y2="258" stroke="#8ab4f8" stroke-opacity="0.35" stroke-width="2"/>
<line x1="621" y1="372" x2="621" y2="650" stroke="#8ab4f8" stroke-opacity="0.35" stroke-width="2"/>

<!-- проход через дверь -->
<line x1="596" y1="315" x2="684" y2="315" stroke="#a5f3fc" stroke-width="6" stroke-linecap="round" filter="url(#soft)" opacity="0.75"/>
<line x1="600" y1="315" x2="680" y2="315" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round"/>

<!-- реестр инвариантов: решётка правил в самом проёме -->
<g class="bar">
 <rect x="626" y="272" width="26" height="4" rx="2" opacity="0.45"/>
 <rect x="626" y="290" width="26" height="4" rx="2" opacity="0.7"/>
 <rect x="626" y="336" width="26" height="4" rx="2" opacity="0.7"/>
 <rect x="626" y="354" width="26" height="4" rx="2" opacity="0.45"/>
</g>

<!-- нарушение отклонено на границе, с именем правила -->
<path d="M612,470 C556,524 492,562 412,570" fill="none" stroke="url(#deny)" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<circle cx="614" cy="470" r="20" fill="#fbbf24" opacity="0.22" filter="url(#soft2)"/>
<circle cx="614" cy="470" r="13" fill="none" stroke="#fbbf24" stroke-width="2.6"/>
<path d="M608,464 L620,476 M620,464 L608,476" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round"/>

<!-- без гейта поток не затухает -->
<path class="ghost" d="M672,315 Q720,131 768,315 Q816,499 864,315 Q912,131 960,315 Q1008,499 1056,315 Q1104,131 1152,315"/>

<!-- после гейта поток возвратов сходится -->
<line class="axis" x1="672" y1="315" x2="1168" y2="315"/>
<path class="wv" d="M672,315 Q720,131 768,315 Q815,451 862,315 Q903,223 944,315 Q977,375 1010,315 Q1036,279 1062,315 Q1082,335 1102,315 L1152,315"/>
<g class="node">
 <circle cx="768" cy="315" r="3.4" opacity="0.55"/>
 <circle cx="862" cy="315" r="3.4" opacity="0.65"/>
 <circle cx="944" cy="315" r="3.4" opacity="0.75"/>
 <circle cx="1010" cy="315" r="3.4" opacity="0.85"/>
 <circle cx="1062" cy="315" r="3.4" opacity="0.92"/>
 <circle cx="1102" cy="315" r="3.4"/>
</g>
<circle cx="1152" cy="315" r="16" fill="#38bdf8" opacity="0.5" filter="url(#soft)"/>
<circle cx="1152" cy="315" r="8" fill="#e0f2fe"/>
<circle cx="1152" cy="315" r="17" fill="none" stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="1.6"/>
</svg>
