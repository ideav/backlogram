<text x="56" y="314" font-family="Inter" font-size="23" font-weight="400" fill="#4b5a6c">из практикующих вайб-кодинг —</text>
<text x="56" y="348" font-family="Inter" font-size="23" font-weight="700" fill="#172033">не разработчики</text>
