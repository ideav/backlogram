<rect x="0.5" y="0.5" width="1199" height="1005" fill="none" stroke="#d9e1ec"/>
<text x="56" y="66" font-family="Inter" font-size="17" font-weight="700" letter-spacing="1.6" fill="#1447e6">САМОСТОЯТЕЛЬНАЯ СБОРКА С ИИ</text>
<text x="56" y="122" font-family="Inter" font-size="40" font-weight="700" fill="#172033">Кто берётся — и с чем сталкивается</text>
