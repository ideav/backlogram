<text x="56" y="826" font-family="Inter" font-size="17" font-weight="400" fill="#66758a">а не выборка всех пользователей.</text>
<line x1="596" y1="196" x2="596" y2="830" stroke="#d9e1ec" stroke-width="1"/>
<text x="640" y="258" font-family="Inter" font-size="52" font-weight="700" fill="#b42318">−17 %</text>
<rect x="1040" y="216" width="104" height="34" rx="17" fill="#fdeceb"/>
<text x="1092" y="239" font-family="Inter" font-size="16" font-weight="700" letter-spacing="1.4" fill="#b42318" text-anchor="middle">РИСК</text>
<text x="640" y="304" font-family="Inter" font-size="22" font-weight="400" fill="#4b5a6c">понимание собственного кода у тех,</text>
<text x="640" y="336" font-family="Inter" font-size="22" font-weight="400" fill="#4b5a6c">кто решал задачу с ИИ</text>
<text x="640" y="386" font-family="Inter" font-size="17" font-weight="400" fill="#66758a">Anthropic, рандомизированный эксперимент, n = 52</text>
<line x1="640" y1="410" x2="1144" y2="410" stroke="#d9e1ec" stroke-width="1"/>
<text x="640" y="478" font-family="Inter" font-size="52" font-weight="700" fill="#b42318">10,3 %</text>
<rect x="1040" y="436" width="104" height="34" rx="17" fill="#fdeceb"/>
<text x="1092" y="459" font-family="Inter" font-size="16" font-weight="700" letter-spacing="1.4" fill="#b42318" text-anchor="middle">РИСК</text>
<text x="640" y="524" font-family="Inter" font-size="22" font-weight="400" fill="#4b5a6c">приложений отдавали чужие данные</text>
<text x="640" y="556" font-family="Inter" font-size="22" font-weight="400" fill="#4b5a6c">любому — 170 из 1 645</text>
<text x="640" y="606" font-family="Inter" font-size="17" font-weight="400" fill="#66758a">Скан 1 645 приложений, собранных на Lovable</text>
<line x1="640" y1="630" x2="1144" y2="630" stroke="#d9e1ec" stroke-width="1"/>
<text x="640" y="698" font-family="Inter" font-size="52" font-weight="700" fill="#1447e6">3 нед. → 3+ года</text>
<text x="640" y="744" font-family="Inter" font-size="22" font-weight="400" fill="#4b5a6c">разброс срока до первого</text>
<text x="640" y="776" font-family="Inter" font-size="22" font-weight="400" fill="#4b5a6c">публичного запуска</text>
<text x="640" y="826" font-family="Inter" font-size="17" font-weight="400" fill="#66758a">Самообзоры сообщества</text>
<rect x="56" y="858" width="1088" height="90" rx="12" fill="#f2f6ff"/><rect x="56" y="858" width="6" height="90" rx="3" fill="#1447e6"/><text x="88" y="898" font-family="Inter" font-size="22" font-weight="700" fill="#172033">Шансы определяются не бэкграундом, а поведением —</text><text x="88" y="930" font-family="Inter" font-size="22" font-weight="400" fill="#4b5a6c">понимаете ли вы, что вам вернули, и есть ли у вас способ это проверить.</text>
