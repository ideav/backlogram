<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1006" viewBox="0 0 1200 1006" role="img" aria-labelledby="t d">
<title id="t">Кто собирает приложения с ИИ самостоятельно и с чем сталкивается</title>
<desc id="d">Слева: сетка из ста клеток, 63 закрашены — доля не-разработчиков среди практикующих вайб-кодинг (разбор 1 000 комментариев r/vibecoding, Vercel/Solveo). Справа три числа: понимание собственного кода на 17% хуже у решавших задачу с ИИ (эксперимент Anthropic, n = 52); 10,3% приложений отдавали чужие данные любому — 170 из 1 645 просканированных; срок до первого публичного запуска — от трёх недель до трёх с лишним лет. Внизу вывод: шансы определяются не бэкграундом, а поведением.</desc>
