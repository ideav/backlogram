text-anchor="middle">кайдзен</text><text x="50" y="360" font-size="18" font-weight="700" fill="#0F1B3D">Время заказа в цехе</text><rect x="50" y="382" width="150" height="46" fill="#C4CCDD"/><rect x="200" y="382" width="36" height="46" fill="#1447E6"/><rect x="236" y="382" width="190" height="46" fill="#C4CCDD"/><rect x="426" y="382" width="44" height="46" fill="#1447E6"/><rect x="470" y="382" width="120" height="46" fill="#C4CCDD"/><rect x="590" y="382" width="100" height="46" fill="#1447E6"/><rect x="690" y="382" width="110" height="46" fill="#C4CCDD"/><rect x="800" y="382" width="34" height="46" fill="#1447E6"/><rect x="834" y="382" width="166" height="46" fill="#C4CCDD"/><rect x="1000" y="382" width="30" height="46" fill="#1447E6"/><rect x="1030" y="382" width="120" height="46" fill="#C4CCDD"/><rect x="50" y="382" width="1100" height="46" rx="8" fill="none" stroke="#0F1B3D" stroke-width="1.5"/><rect x="50" y="456" width="22" height="22" rx="4" fill="#1447E6"/><text x="82" y="473" font-size="16" fill="#0F1B3D">Работа над заказом — добавляет ценность</text><rect x="440" y="456" width="22" height="22" rx="4" fill="#C4CCDD"/><text x="472" y="473" font-size="16" fill="#0F1B3D">Ожидание, очереди, переналадки — потери</text><polygon points="850,456 861,478 839,478" fill="#FFF4E6" stroke="#E8590C" stroke-width="2"/><text x="873" y="473" font-size="16" fill="#0F1B3D">Очередь между шагами</text><rect x="50" y="510" width="1100" height="64" rx="12" fill="#fff" stroke="#DCE3F2" stroke-width="1.5"/><text x="74" y="536" font-size="17" font-weight="700" fill="#0F1B3D">Как использовать карту</text><text x="74" y="560" font-size="16" fill="#5B6785">Нанесите реальное время из журнала, найдите самые длинные серые участки и выберите инструмент Lean под каждый.</text><text x="1150" y="648" font-size="14" fill="#5B6785" text-anchor="end">Схема иллюстративная: длительности условные</text>
<text x="50" y="648" font-size="14" fill="#5B6785">Блог Интеграм · ideav.ru</text>
