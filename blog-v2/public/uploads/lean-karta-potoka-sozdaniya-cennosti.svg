<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Карта потока создания ценности</title><desc id="d">Шаги от заказа до отгрузки с очередями между ними и шкалой времени, где ожидание занимает большую часть, а работа над заказом — малую.</desc>
<rect width="1200" height="675" fill="#F5F7FB"/>
<text x="50" y="78" font-size="38" font-weight="700" fill="#0F1B3D">Карта потока создания ценности</text><text x="50" y="112" font-size="19" fill="#5B6785">От заказа до отгрузки: работа над заказом занимает малую часть времени, остальное — ожидание.</text><rect x="50" y="160" width="140" height="92" rx="12" fill="#1447E6"/><text x="120.0" y="212.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Заказ</text><rect x="50" y="266" width="140" height="30" rx="15" fill="#fff" stroke="#DCE3F2" stroke-width="1.5"/><text x="120.0" y="286" font-size="13" font-weight="600" fill="#1447E6" text-anchor="middle">вытягивание</text><line x1="194" y1="206.0" x2="238" y2="206.0" stroke="#5B6785" stroke-width="2"/><polygon points="216.0,189.0 231.0,216.0 201.0,216.0" fill="#FFF4E6" stroke="#E8590C" stroke-width="2"/><text x="216.0" y="212.0" font-size="12" font-weight="700" fill="#E8590C" text-anchor="middle">!</text><rect x="242" y="160" width="140" height="92" rx="12" fill="#1447E6"/><text x="312.0" y="212.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Планирование</text><rect x="242" y="266" width="140" height="30" rx="15" fill="#fff" stroke="#DCE3F2" stroke-width="1.5"/><text x="312.0" y="286" font-size="13" font-weight="600" fill="#1447E6" text-anchor="middle">хейдзунка</text><line x1="386" y1="206.0" x2="430" y2="206.0" stroke="#5B6785" stroke-width="2"/><polygon points="408.0,189.0 423.0,216.0 393.0,216.0" fill="#FFF4E6" stroke="#E8590C" stroke-width="2"/><text x="408.0" y="212.0" font-size="12" font-weight="700" fill="#E8590C" text-anchor="middle">!</text><rect x="434" y="160" width="140" height="92" rx="12" fill="#1447E6"/><text x="504.0" y="212.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Наладка</text><rect x="434" y="266" width="140" height="30" rx="15" fill="#fff" stroke="#DCE3F2" stroke-width="1.5"/><text x="504.0" y="286" font-size="13" font-weight="600" fill="#1447E6" text-anchor="middle">SMED</text><line 