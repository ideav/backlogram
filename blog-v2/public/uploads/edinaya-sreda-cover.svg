<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Единая операционная среда для бизнеса и ИИ-агентов</title>
<desc id="d">Excel-таблица превращается в приложение, с которым работают три стороны: люди, ИИ-чат внутри базы и внешние агенты через MCP.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#060d20"/><stop offset="0.55" stop-color="#0a1c47"/><stop offset="1" stop-color="#123a8f"/>
 </linearGradient>
 <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#60a5fa" stop-opacity="0.40"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
 </radialGradient>
 <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="1.3" fill="#8ab4f8" fill-opacity="0.12"/>
 </pattern>
 <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7dd3fc"/></marker>
 <style>
  .node{fill:#0d2557;stroke:#38bdf8;stroke-opacity:0.5;stroke-width:1.8}
  .ttl{fill:#ffffff;font:700 50px Arial,sans-serif}
  .ttl2{fill:#7dd3fc;font:700 50px Arial,sans-serif}
  .sub{fill:#cfe0ff;fill-opacity:0.85;font:400 18px Arial,sans-serif}
  .lbl{fill:#e0f2fe;font:700 17px Arial,sans-serif}
  .lbl2{fill:#cfe0ff;fill-opacity:0.7;font:400 13px Arial,sans-serif}
  .cell{fill:#0a1f4d;stroke:#38bdf8;stroke-opacity:0.35;stroke-width:1}
  .head{fill:#14407f;stroke:#38bdf8;stroke-opacity:0.5;stroke-width:1}
  .ct{fill:#cfe0ff;font:400 12px Arial,sans-serif}
  .ch{fill:#ffffff;font:700 12px Arial,sans-serif}
 </style>
</defs>

<rect width="1200" height="630" fill="url(#bg)"/>
<rect width="1200" height="630" fill="url(#dots)"/>
<circle cx="900" cy="315" r="300" fill="url(#glow)"/>

<text x="64" y="132" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3" fill="#7dd3fc" fill-opacity="0.9">МЕСТНЫЙ БИЗНЕС • ИИ-АГЕНТЫ</text>
<text class="ttl" x="64" y="200">Единая</text>
<text class="ttl" x="64" y="260">операционная среда</text>
<text class="ttl2" x="64" y="320">бизнеса и агентов</text>
<text class="sub" x="64" y="378">Excel-таблица становится средой, где работают</text>
<text class="sub" x="64" y="404">люди, ИИ-чат и внешние агенты.</text>

