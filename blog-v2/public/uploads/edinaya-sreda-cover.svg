<text class="lbl" x="740" y="408" text-anchor="middle">Ваша таблица</text>
<text class="lbl2" x="740" y="428" text-anchor="middle">Excel или CSV</text>
<line x1="872" y1="300" x2="924" y2="170" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arr)"/>
<rect class="node" x="932" y="130" width="220" height="80" rx="16"/><text class="lbl" x="1042" y="166" text-anchor="middle">Люди</text><text class="lbl2" x="1042" y="188" text-anchor="middle">журналы, карточки, отчёты</text>
<line x1="872" y1="300" x2="924" y2="315" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arr)"/>
<rect class="node" x="932" y="275" width="220" height="80" rx="16"/><text class="lbl" x="1042" y="311" text-anchor="middle">ИИ-чат внутри</text><text class="lbl2" x="1042" y="333" text-anchor="middle">доработки обычными словами</text>
<line x1="872" y1="300" x2="924" y2="460" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arr)"/>
<rect class="node" x="932" y="420" width="220" height="80" rx="16"/><text class="lbl" x="1042" y="456" text-anchor="middle">Внешние агенты</text><text class="lbl2" x="1042" y="478" text-anchor="middle">MCP с правами пользователя</text>
</svg>
