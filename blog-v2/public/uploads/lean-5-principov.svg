<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">5 принципов бережливого производства</title><desc id="d">Пять шагов цикла: ценность, поток создания ценности, непрерывный поток, вытягивание, совершенство; стрелка возвращает от совершенства к ценности.</desc>
<rect width="1200" height="675" fill="#F5F7FB"/>
<text x="50" y="78" font-size="38" font-weight="700" fill="#0F1B3D">5 принципов бережливого производства</text><text x="50" y="112" font-size="19" fill="#5B6785">Principles of Lean Thinking: Джеймс Вумек и Дэниел Джонс, 1996</text><polygon points="50,170 260,170 290,234 260,298 50,298" fill="#4A74F2"/><text x="76" y="222" font-size="36" font-weight="700" fill="#fff" opacity="0.55">1</text><text x="76" y="254.0" font-size="19" font-weight="700" fill="#fff" text-anchor="start">Ценность</text><text x="64" y="342.0" font-size="16" font-weight="400" fill="#0F1B3D" text-anchor="start">За что заказчик</text>
<text x="64" y="364.4" font-size="16" font-weight="400" fill="#0F1B3D" text-anchor="start">действительно платит?</text><polygon points="265,170 475,170 505,234 475,298 265,298 295,234" fill="#2F5DEB"/><text x="317" y="222" font-size="36" font-weight="700" fill="#fff" opacity="0.55">2</text><text x="317" y="254.0" font-size="19" font-weight="700" fill="#fff" text-anchor="start">Поток создания</text>
<text x="317" y="276.8" font-size="19" font-weight="700" fill="#fff" text-anchor="start">ценности</text><text x="279" y="342.0" font-size="16" font-weight="400" fill="#0F1B3D" text-anchor="start">Какие шаги проходит</text>
<text x="279" y="364.4" font-size="16" font-weight="400" fill="#0F1B3D" text-anchor="start">заказ от запроса до</text>
<text x="279" y="386.8" font-size="16" font-weight="400" fill="#0F1B3D" text-anchor="start">отгрузки и какие из них</text>
<text x="279" y="409.2" font-size="16" font-weight="400" fill="#0F1B3D" text-anchor="start">лишние?</text><polygon points="480,170 690,170 720,234 690,298 480,298 510,234" fill="#1447E6"/><text x="532" y="222" font-size="36" font-weight="700" fill="#fff" opacity="0.55">3</text><text x="532" y="254.0" font-size="19" font-weight="700" fill="#fff" text-anchor="start">Непрерывный</text>
<text x="532" y="276.8" font-size="19" font-weight="700" fill="#fff" text-anchor="start">поток</text><text x="494" y="342.0" font-size="16" font-weight="400" fill="#0F1B3D" text-anchor="start">Где очереди и ожидания</text>
<text x="494" y="364.4" font-size="16" font-weight="400" fill="#0F1B3D" text-anchor="start">между шагами и как их</text>
<text x="494" y="386.8" font-size="16" font-weight="400" fill="#0F1B3D" text-anchor="start">убрать?</text><polygon points="695,170 905,170 935,234 905,298 695,298 725,234" fill="#0F38B8"/><text x="747" y="222" font-size="36" font-weight="700" fill="#fff" opacity="0.55">4</text><text x="747" y="254.0" font-size="19" font-weight="700" fill="#fff" text-anchor="start">Вытягивание</text><text x="709" y="342.0" font-size="16" font-weight="400" fill="#0F1B3D" text-anchor="start">Делаем то, что нужно</text>
<text x="709" y="364.4" font-size="16" font-weight="400" fill="#0F1B3D" text-anchor="start">следующему шагу и</text>
<text x="709" y="386.8" font-size="16" font-weight="400" fill="#0F1B3D" text-anchor="start">заказчику, а не «на</text>
<text x="709" y="409.2" font-size="16" font-weight="400" fill="#0F1B3D" text-anchor="start">склад»</text><polygon points="910,170 1120,170 1150,234 1120,298 910,298 940,234" fill="#0B2B8F"/><text x="962" y="222" font-size="36" font-weight="700" fill="#fff" opacity="0.55">5</text><text x="962" y="254.0" font-size="19" font-weight="700" fill="#fff" text-anchor="start">Совершенство</text><text x="924" y="342.0" font-size="16" font-weight="400" fill="#0F1B3D" text-anchor="start">Повторяем цикл</text>
<text x="924" y="364.4" font-size="16" font-weight="400" fill="#0F1B3D" text-anchor="start">постоянно — это и есть</text>
<text x="924" y="386.8" font-size="16" font-weight="400" fill="#0F1B3D" text-anchor="start">кайдзен</text><path d="M1030.0 448 V492 H170.0 V460" fill="none" stroke="#5B6785" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/><polygon points="170.0,444 162.0,460 178.0,460" fill="#5B6785"/><text x="600.0" y="520" font-size="17" font-weight="600" fill="#5B6785" text-anchor="middle">Новый виток: после совершенства снова к ценности</text><rect x="50" y="548" width="1100" height="72" rx="12" fill="#fff" stroke="#DCE3F2" stroke-width="1.5"/><text x="74" y="577" font-size="17" font-weight="700" fill="#0F1B3D">Важно</text><text x="74" y="603" font-size="16" fill="#5B6785">Lean — это привычка смотреть на поток, а не программа: инструменты работают, когда за ними стоит разбор простоев.</text>
<text x="50" y="648" font-size="14" fill="#5B6785">Блог Интеграм · ideav.ru</text>
</svg>