<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Google Таблицы в 2026: риски и куда перенести таблицы</title>
<desc id="d">Таблица в чужом облаке с предупреждением, два пути переноса: российский табличный редактор и база данных на своём сервере.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#060d20"/><stop offset="0.55" stop-color="#0a1c47"/><stop offset="1" stop-color="#123a8f"/>
 </linearGradient>
 <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#60a5fa" stop-opacity="0.40"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="strong" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#3b6bc4" stop-opacity="0.35"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0.95"/>
 </linearGradient>
 <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="1.3" fill="#8ab4f8" fill-opacity="0.12"/>
 </pattern>
 <marker id="arrC" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#cfe0ff"/></marker>
 <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7dd3fc"/></marker>
 <style>
  .grid{stroke:#7dd3fc;stroke-opacity:0.22;stroke-width:1.2}
  .card{fill:#0d2557;stroke:#38bdf8;stroke-opacity:0.45;stroke-width:1.6}
  .cell{fill:#38bdf8;fill-opacity:0.28}
  .ttl{fill:#ffffff;font:700 54px Arial,sans-serif}
  .ttl2{fill:#7dd3fc;font:700 54px Arial,sans-serif}
  .brow{fill:#ffffff;font:700 20px Arial,sans-serif;letter-spacing:1px}
  .tag{fill:#bfd7ff;font:400 8px Arial,sans-serif;letter-spacing:1.2px}
  .sub{fill:#cfe0ff;fill-opacity:0.85;font:400 18px Arial,sans-serif}
  .lbl{fill:#e0f2fe;font:700 13.5px Arial,sans-serif}
  .lbl2{fill:#cfe0ff;fill-opacity:0.7;font:400 11.5px Arial,sans-serif}
 </style>
</defs>

<rect width="1200" height="630" fill="url(#bg)"/>
<rect width="1200" height="630" fill="url(#dots)"/>
<circle cx="880" cy="320" r="310" fill="url(#glow)"/>
<circle cx="240" cy="120" r="240" fill="url(#glow)" opacity="0.5"/>

<!-- заголовочный блок -->
<text x="64" y="154" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3" fill="#7dd3fc" fill-opacity="0.9">ЧЕК-ЛИСТ • РИСКИ • ПЕРЕНОС</text>
<text class="ttl" x="64" y="224">Google Таблицы</text>
<text class="ttl" x="64" y="288">в 2026: риски</text>
<text class="ttl2" x="64" y="352">и куда переносить</text>
<text class="sub" x="64" y="410">Что переносить в первую очередь, когда хватит</text>
<text class="sub" x="64" y="436">табличного редактора, а когда нужна база.</text>

<!-- таблица в чужом облаке -->
<g>
 <rect class="card" x="640" y="118" width="220" height="286" rx="14"/>
 <line class="grid" x1="640" y1="154" x2="860" y2="154" stroke-opacity="0.45"/>
 <line class="grid" x1="695" y1="118" x2="695" y2="404"/>
 <line class="grid" x1="750" y1="118" x2="750" y2="404"/>
 <line class="grid" x1="805" y1="118" x2="805" y2="404"/>
 <line class="grid" x1="640" y1="192" x2="860" y2="192"/>
 <line class="grid" x1="640" y1="230" x2="860" y2="230"/>
 <line class="grid" x1="640" y1="268" x2="860" y2="268"/>
 <line class="grid" x1="640" y1="306" x2="860" y2="306"/>
 <line class="grid" x1="640" y1="344" x2="860" y2="344"/>
 <rect class="cell" x="646" y="160" width="43" height="26" rx="3"/>
 <rect class="cell" x="756" y="198" width="43" height="26" rx="3"/>
 <rect class="cell" x="646" y="274" width="43" height="26" rx="3"/>
 <rect class="cell" x="811" y="312" width="43" height="26" rx="3"/>
 <rect class="cell" x="701" y="350" width="43" height="26" rx="3"/>
</g>
<path d="M838,76 L862,118 L814,118 Z" fill="#fbbf24"/>
<text x="838" y="112" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">!</text>
<text class="lbl2" x="750" y="432" text-anchor="middle">таблица в чужом облаке</text>

<!-- путь 1: табличный редактор -->
<path d="M866,186 C900,182 916,174 944,168" fill="none" stroke="#cfe0ff" stroke-opacity="0.55" stroke-width="2" marker-end="url(#arrC)"/>
<g>
 <rect class="card" x="950" y="112" width="160" height="106" rx="12"/>
 <line class="grid" x1="950" y1="142" x2="1110" y2="142" stroke-opacity="0.45"/>
 <line class="grid" x1="1003" y1="112" x2="1003" y2="218"/>
 <line class="grid" x1="1056" y1="112" x2="1056" y2="218"/>
 <line class="grid" x1="950" y1="173" x2="1110" y2="173"/>
 <line class="grid" x1="950" y1="195" x2="1110" y2="195"/>
 <rect class="cell" x="955" y="147" width="43" height="21" rx="3"/>
</g>
<text class="lbl" x="1030" y="252" text-anchor="middle">табличный редактор</text>
<text class="lbl2" x="1030" y="272" text-anchor="middle">Яндекс / МойОфис / Р7</text>

<!-- путь 2: база на своём сервере -->
<path d="M866,330 C910,348 916,392 946,410" fill="none" stroke="url(#strong)" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrA)"/>
<g>
 <path d="M980,378 L980,448 A55,18 0 0 0 1090,448 L1090,378" fill="#0d2557" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.6"/>
 <ellipse cx="1035" cy="378" rx="55" ry="18" fill="#0d2557" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.6"/>
 <path d="M980,402 A55,18 0 0 0 1090,402" fill="none" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1.2"/>
 <path d="M980,425 A55,18 0 0 0 1090,425" fill="none" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1.2"/>
</g>
<path d="M1112,352 l16,7 v13 c0,11 -9,17 -16,20 c-7,-3 -16,-9 -16,-20 v-13 z" fill="none" stroke="#fbbf24" stroke-width="2.2"/>
<path d="M1104,372 l6,6 l10,-11" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>
<text class="lbl" x="1035" y="502" text-anchor="middle">база на своём сервере</text>
<text class="lbl2" x="1035" y="522" text-anchor="middle">права, связи, формы</text>

<!-- бейдж -->
<g transform="translate(946,538) scale(0.47)">
 <rect width="120" height="120" rx="24" fill="#1447E6"/>
 <path d="M43.8 85.2 12 74.7V45.3l31.8-10.5 11.7 12.4-7.1 7.4-8.1-8.6-17.7 5.8v16.4L40.3 74 77.6 34.8 108 45.3v29.4L76.2 85.2 64.5 72.8l7.1-7.4 8.1 8.6 17.7-5.8V51.8L79.7 46 43.8 85.2Z" fill="#FFFFFF"/>
 <path d="M42.4 63.5 33 53.8l7.2-7.4 9.4 9.8-7.2 7.3ZM79.8 73.6l-9.4-9.8 7.2-7.3 9.4 9.7-7.2 7.4Z" fill="#BFD7FF"/>
</g>
<text class="brow" x="1008" y="570">ИНТЕГРАМ</text>
<text class="tag" x="1009" y="588">СИСТЕМА ИНТЕГРАЦИИ ДАННЫХ</text>
</svg>
