<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">10 признаков, что таблице пора стать базой данных</title>
<desc id="d">Чек-лист из десяти строк с отмеченными пунктами ведёт к базе данных: таблица, которая тормозит и разъезжается на версии, переезжает в базу.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#060d20"/><stop offset="0.55" stop-color="#0a1c47"/><stop offset="1" stop-color="#123a8f"/>
 </linearGradient>
 <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#60a5fa" stop-opacity="0.40"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="strong" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#3b6bc4" stop-opacity="0.35"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0.95"/>
 </linearGradient>
 <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="1.3" fill="#8ab4f8" fill-opacity="0.12"/>
 </pattern>
 <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7dd3fc"/></marker>
 <style>
  .card{fill:#0d2557;stroke:#38bdf8;stroke-opacity:0.45;stroke-width:1.6}
  .box{fill:none;stroke:#7dd3fc;stroke-opacity:0.55;stroke-width:1.6}
  .chk{fill:none;stroke:#7dd3fc;stroke-width:2.2;stroke-linecap:round}
  .bar{fill:#7dd3fc;fill-opacity:0.30}
  .ttl{fill:#ffffff;font:700 54px Arial,sans-serif}
  .ttl2{fill:#7dd3fc;font:700 54px Arial,sans-serif}
  .brow{fill:#ffffff;font:700 20px Arial,sans-serif;letter-spacing:1px}
  .tag{fill:#bfd7ff;font:400 8px Arial,sans-serif;letter-spacing:1.2px}
  .sub{fill:#cfe0ff;fill-opacity:0.85;font:400 18px Arial,sans-serif}
  .lbl{fill:#e0f2fe;font:700 13.5px Arial,sans-serif}
  .lbl2{fill:#cfe0ff;fill-opacity:0.7;font:400 11.5px Arial,sans-serif}
 </style>
</defs>

<rect width="1200" height="630" fill="url(#bg)"/>
<rect width="1200" height="630" fill="url(#dots)"/>
<circle cx="860" cy="320" r="310" fill="url(#glow)"/>
<circle cx="230" cy="130" r="230" fill="url(#glow)" opacity="0.5"/>

<!-- заголовочный блок -->
<text x="64" y="150" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3" fill="#7dd3fc" fill-opacity="0.9">ЧЕК-ЛИСТ • ТАБЛИЦА → БАЗА</text>
<text class="ttl" x="64" y="220">10 признаков:</text>
<text class="ttl" x="64" y="284">таблице пора</text>
<text class="ttl2" x="64" y="348">стать базой</text>
<text class="sub" x="64" y="406">Тормозит, лимит строк, заявки ведут пятеро —</text>
<text class="sub" x="64" y="432">проверьте свою таблицу за пару минут.</text>

<!-- чек-лист -->
<g>
 <rect class="card" x="652" y="104" width="300" height="416" rx="14"/>
 <line x1="652" y1="146" x2="952" y2="146" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1.2"/>
</g>
<g>
 <rect class="box" x="676" y="162" width="16" height="16" rx="4"/><path class="chk" d="M679,170 l3.5,3.5 l6.5,-7.5"/><rect class="bar" x="706" y="165" width="180" height="10" rx="5"/>
 <rect class="box" x="676" y="200" width="16" height="16" rx="4"/><path class="chk" d="M679,208 l3.5,3.5 l6.5,-7.5"/><rect class="bar" x="706" y="203" width="150" height="10" rx="5"/>
 <rect class="box" x="676" y="238" width="16" height="16" rx="4"/><path class="chk" d="M679,246 l3.5,3.5 l6.5,-7.5"/><rect class="bar" x="706" y="241" width="196" height="10" rx="5"/>
 <rect class="box" x="676" y="276" width="16" height="16" rx="4"/><path class="chk" d="M679,284 l3.5,3.5 l6.5,-7.5"/><rect class="bar" x="706" y="279" width="130" height="10" rx="5"/>
 <rect class="box" x="676" y="314" width="16" height="16" rx="4"/><path class="chk" d="M679,322 l3.5,3.5 l6.5,-7.5"/><rect class="bar" x="706" y="317" width="172" height="10" rx="5"/>
 <rect class="box" x="676" y="352" width="16" height="16" rx="4"/><path class="chk" d="M679,360 l3.5,3.5 l6.5,-7.5"/><rect class="bar" x="706" y="355" width="158" height="10" rx="5"/>
 <rect class="box" x="676" y="390" width="16" height="16" rx="4"/><path class="chk" d="M679,398 l3.5,3.5 l6.5,-7.5"/><rect class="bar" x="706" y="393" width="188" height="10" rx="5"/>
 <rect class="box" x="676" y="428" width="16" height="16" rx="4"/><path class="chk" d="M679,436 l3.5,3.5 l6.5,-7.5"/><rect class="bar" x="706" y="431" width="142" height="10" rx="5"/>
 <rect class="box" x="676" y="466" width="16" height="16" rx="4"/><rect class="bar" x="706" y="469" width="176" height="10" rx="5"/>
 <rect class="box" x="676" y="494" width="16" height="16" rx="4"/><rect class="bar" x="706" y="497" width="120" height="10" rx="5"/>
</g>
<text class="lbl2" x="802" y="132" text-anchor="middle">знакомые пункты?</text>

<!-- стрелка к базе -->
<path d="M958,312 C990,315 1000,318 1024,320" fill="none" stroke="url(#strong)" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrA)"/>

<!-- база данных -->
<g>
 <path d="M1032,298 L1032,368 A48,16 0 0 0 1128,368 L1128,298" fill="#0d2557" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.8"/>
 <ellipse cx="1080" cy="298" rx="48" ry="16" fill="#0d2557" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.8"/>
 <path d="M1032,320 A48,16 0 0 0 1128,320" fill="none" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1.2"/>
 <path d="M1032,342 A48,16 0 0 0 1128,342" fill="none" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1.2"/>
</g>
<text class="lbl" x="1080" y="420" text-anchor="middle">база данных</text>
<text class="lbl2" x="1080" y="440" text-anchor="middle">связи, формы, роли</text>

<!-- бейдж -->
<g transform="translate(946,538) scale(0.47)">
 <rect width="120" height="120" rx="24" fill="#1447E6"/>
 <path d="M43.8 85.2 12 74.7V45.3l31.8-10.5 11.7 12.4-7.1 7.4-8.1-8.6-17.7 5.8v16.4L40.3 74 77.6 34.8 108 45.3v29.4L76.2 85.2 64.5 72.8l7.1-7.4 8.1 8.6 17.7-5.8V51.8L79.7 46 43.8 85.2Z" fill="#FFFFFF"/>
 <path d="M42.4 63.5 33 53.8l7.2-7.4 9.4 9.8-7.2 7.3ZM79.8 73.6l-9.4-9.8 7.2-7.3 9.4 9.7-7.2 7.4Z" fill="#BFD7FF"/>
</g>
<text class="brow" x="1008" y="570">ИНТЕГРАМ</text>
<text class="tag" x="1009" y="588">СИСТЕМА ИНТЕГРАЦИИ ДАННЫХ</text>

</svg>
